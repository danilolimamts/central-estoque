  <main class="content">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="trToggleSidebar()" title="Abrir menu" aria-label="Abrir menu">

      </button>
      <div>
        <h1 id="tabTitle">Dashboard Executivo</h1>
        <p id="tabSubtitle">Visão geral dos transitórios do CD.</p>
      </div>
      <input class="global-search" id="globalSearch" type="text" placeholder="Filtrar transitório (código ou descrição)..." oninput="trOnBusca(this.value)">
      <div class="cycle-badge" id="baseBadge">Nenhuma base carregada</div>
    </div>
    <div class="page-scroll">
      <div id="viewRoot"><p class="field-hint">Carregando...</p></div>
    </div>
  </main>
  <div class="sidebar-backdrop" onclick="trCloseSidebarMobile()"></div>
</div>

<div class="zoom-ctrl zoom-ctrl-float" title="Zoom da tela">
  <button onclick="trZoomOut()" aria-label="Diminuir zoom">−</button>
  <span id="zoomLabel">100%</span>
  <button onclick="trZoomIn()" aria-label="Aumentar zoom">+</button>
</div>

<div id="toast" class="toast hidden"></div>
<div id="trPrintArea"></div>
<div id="trChartTooltip" class="chart-tooltip hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/db.js"></script>
<script src="js/rules.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
<script>
  trInit();
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg=>{
        reg.update();
        reg.addEventListener('updatefound', ()=>{
          const novo = reg.installing;
          if(!novo) return;
          novo.addEventListener('statechange', ()=>{
            if(novo.state==='activated' && hadController) window.location.reload();
          });
        });
      }).catch(err=>console.warn('SW falhou ao registrar', err));
    });
  }
</script>
</body>
</html>
